<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>HVTO Free Education Center</title>
    <script src="https://jsdelivr.net"></script>
    <link rel="stylesheet" href="https://googleapis.com">
    <style>
        :root {
            --bg: #1c1708;
            --card: rgba(43, 36, 16, .86);
            --solid: #2b2110;
            --green: #4CAF50;
            --line: #3d311d;
            --soft: #231c0e;
            --ink: #FFF8E1;
            --muted: #a89f8d;
        }
        
        * { box-sizing: border-box; }
        
        body {
            margin: 0;
            background-color: var(--bg);
            color: var(--ink);
            font-family: 400 15px/1.5 Outfit, "Noto Sans Khmer", system-ui, sans-serif;
            padding: 20px;
        }

        h2 {
            font-family: Fraunces, "Noto Sans Khmer", Georgia, serif;
            font-weight: 600;
            font-size: 34px;
            margin: 0 0 20px 0;
            color: var(--ink);
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 28px;
            padding: 40px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .full-width {
            grid-column: span 2;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: 600;
            color: var(--ink);
        }

        input, select, textarea {
            width: 100%;
            background: var(--soft);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 12px 16px;
            color: inherit;
            font-family: inherit;
            font-size: 15px;
            outline-offset: 2px;
        }

        input:focus, select:focus, textarea:focus {
            outline: 3px solid var(--green);
        }

        .radio-group {
            display: flex;
            gap: 16px;
            align-items: center;
            height: 45px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .radio-option input {
            width: auto;
            cursor: pointer;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 16px;
            margin-top: 30px;
        }

        .btn {
            background: var(--green);
            color: var(--bg);
            border: 0;
            border-radius: 99px;
            padding: 12px 32px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-secondary {
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--line);
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Add student</h2>
    <form id="student-form">
        <div class="form-grid">
            <div class="form-group">
                <label for="student_id">Student ID</label>
                <input type="text" id="student_id" required placeholder="e.g. STU001">
            </div>

            <div class="form-group">
                <label for="enrollment_date">Enrollment date</label>
                <input type="date" id="enrollment_date">
            </div>

            <div class="form-group">
                <label for="full_name_khmer">Full name (Khmer)</label>
                <input type="text" id="full_name_khmer" placeholder="ឈ្មោះពេញជាភាសាខ្មែរ">
            </div>

            <div class="form-group">
                <label for="full_name_english">Full name (English)</label>
                <input type="text" id="full_name_english" required placeholder="Full name in English">
            </div>

            <div class="form-group">
                <label>Sex</label>
                <div class="radio-group">
                    <label class="radio-option"><input type="radio" name="sex" value="Male" checked> Male</label>
                    <label class="radio-option"><input type="radio" name="sex" value="Female"> Female</label>
                    <label class="radio-option"><input type="radio" name="sex" value="Other"> Other</label>
                </div>
            </div>

            <div class="form-group">
                <label for="birthday">Birthday</label>
                <input type="date" id="birthday">
            </div>

            <div class="form-group">
                <label for="father_name">Father's name</label>
                <input type="text" id="father_name">
            </div>

            <div class="form-group">
                <label for="mother_name">Mother's name</label>
                <input type="text" id="mother_name">
            </div>

            <div class="form-group">
                <label for="phone_number">Phone number</label>
                <input type="text" id="phone_number">
            </div>

            <div class="form-group">
                <label for="khmer_school">Khmer school</label>
                <input type="text" id="khmer_school">
            </div>

            <div class="form-group">
                <label for="village">Village</label>
                <input type="text" id="village">
            </div>

            <div class="form-group">
                <label for="commune">Commune</label>
                <input type="text" id="commune">
            </div>

            <div class="form-group">
                <label for="district">District</label>
                <input type="text" id="district">
            </div>

            <div class="form-group">
                <label for="province">Province</label>
                <input type="text" id="province">
            </div>

            <div class="form-group">
                <label for="english_level">English level</label>
                <select id="english_level">
                    <option value="ISS1">ISS1</option>
                    <option value="ISS2">ISS2</option>
                    <option value="ISS3">ISS3</option>
                    <option value="ISS4">ISS4</option>
                    <option value="ISS5">ISS5</option>
                    <option value="ISS6">ISS6</option>
                    <option value="Beginner">Beginner</option>
                    <option value="Elementary">Elementary</option>
                    <option value="Pre-intermediate">Pre-intermediate</option>
                    <option value="Intermediate">Intermediate</option>
                    <option value="Upper-intermediate">Upper-intermediate</option>
                    <option value="Advanced">Advanced</option>
                </select>
            </div>

            <div class="form-group">
                <label for="student_status">Status</label>
                <select id="student_status">
                    <option value="Active" selected>Active</option>
                    <option value="Dropped">Dropped</option>
                    <option value="Graduated">Graduated</option>
                </select>
            </div>

            <div class="form-group full-width">
                <label for="notes">Notes</label>
                <textarea id="notes" rows="3" placeholder="Additional details..."></textarea>
            </div>
        </div>

        <div class="actions">
            <button type="button" class="btn btn-secondary">Cancel</button>
            <button type="submit" class="btn" id="save-student-btn">Save student</button>
        </div>
    </form>
</div>
