*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Outfit,"Noto Sans Khmer",system-ui,sans-serif}
.serif,h1,h2{font-family:Fraunces,"Noto Sans Khmer",Georgia,serif;font-weight:600}
html[lang=km] body{line-height:1.8}.tl{display:flex;gap:8px;margin-right:auto}
h1{font-size:34px;margin:8px 0 2px}h2{font-size:23px;margin:0}
.sub,small,.muted{color:var(--muted)}
button,input,select,textarea{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.login{min-height:100vh;display:grid;place-items:center;padding:16px}
.box{background:var(--card);border-radius:28px;padding:36px 40px;width:min(560px,100%)}
.box h1{font-size:44px;margin:0}
label.f{display:block;margin:16px 0 6px}
input,select,textarea{width:100%;background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:12px 16px}
textarea{border-radius:16px;min-height:80px}
.btn{background:var(--green);color:var(--on);border:0;border-radius:99px;padding:12px 22px;font-weight:600;cursor:pointer}
.btn.full{width:100%;margin-top:20px;padding:16px;font-size:18px}
.link{background:none;border:0;color:var(--muted);cursor:pointer;padding:0}
.err{color:var(--bad);margin:10px 0 0;min-height:1em}
.shell{display:grid;grid-template-columns:260px 1fr;gap:28px;max-width:1240px;margin:0 auto;padding:24px 20px}
.brand{display:flex;gap:12px;align-items:center;margin-bottom:18px}
.logo,.av{display:grid;place-items:center;border-radius:16px;background:var(--green);color:var(--on);width:48px;height:48px;font:600 22px Fraunces,serif}
aside nav{display:grid;gap:8px}
aside nav button{background:var(--card);border:0;border-radius:16px;padding:14px 18px;text-align:left;font-weight:500;cursor:pointer}
aside nav button.on{background:var(--green);color:var(--on)}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-top:6px}
header label{display:flex;align-items:center;gap:10px;color:var(--muted)}header select{width:270px;background:var(--card);border-radius:14px}
.who{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:8px}
.who .av{width:30px;height:30px;font-size:14px;border-radius:50%;background:var(--card);color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:18px 0}
.card{background:var(--card);border-radius:24px;padding:18px 22px;margin-bottom:16px}
.cards .card{margin:0}.cards .n{font:600 34px Fraunces,serif;display:block}
.row{display:flex;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.row .av{width:44px;height:44px;border-radius:50%;background:var(--tint);color:var(--green);font-size:18px;flex:none;overflow:hidden}
.row .av img,td .av img{width:100%;height:100%;object-fit:cover}
.grow{flex:1;min-width:0}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.bar input{width:240px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:720px}
th{text-align:left;color:var(--muted);font-weight:500;padding:8px 10px}
td{padding:10px;border-top:1px solid var(--line);vertical-align:middle}
td input,td textarea{padding:8px 10px;border-radius:10px;min-height:0;height:38px;resize:vertical}
td input[type=number]{width:110px}
.pill{display:inline-block;border-radius:99px;padding:2px 12px;background:var(--tint);font-size:13px}
.pill.bad{background:#f3dcd6;color:#7a2a1f}
.empty{padding:36px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:18px}
.bars div.b{display:grid;grid-template-columns:minmax(120px,260px) 1fr 70px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.bars i{display:block;height:14px;border-radius:99px;background:var(--green);min-width:2px}
dialog{border:0;border-radius:24px;background:var(--solid);color:var(--ink);padding:26px;width:min(720px,94vw);max-height:92vh}
dialog::backdrop{background:rgba(10,14,10,.55)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.g .w{grid-column:1/-1}
.g label{display:block;margin:12px 0 4px;color:var(--muted);font-size:14px}
.sw{display:flex!important;align-items:center;gap:10px;color:var(--ink)!important;margin-top:30px!important}.sw input{width:20px;height:20px}
.photo{display:flex;gap:12px;align-items:center}.photo img{width:56px;height:56px;border-radius:14px;object-fit:cover;background:var(--soft)}
@media (max-width:820px){.shell{grid-template-columns:1fr}aside nav{grid-auto-flow:column;overflow-x:auto;grid-auto-columns:max-content}.g{grid-template-columns:1fr}.box{padding:26px}}
header{justify-content:flex-end}
.top{text-align:center;padding:18px 16px 0}.top .sub{font-weight:500;margin-top:4px}
.hlogo{height:96px;width:96px;border-radius:50%;background:#fff;display:block;margin:0 auto}
.fc{height:76px;width:76px;border-radius:16px;background:#fff;flex:none}
.login .hlogo{height:120px;width:120px;margin:0 auto 12px}
.shell{padding-top:14px}
tr[data-det],.row[data-det]{cursor:pointer}tr[data-det]:hover td{background:var(--soft)}
.dl{display:grid;grid-template-columns:160px 1fr;gap:10px 16px;margin:18px 0}.dl dt{color:var(--muted)}.dl dd{margin:0;overflow-wrap:anywhere}
.ro{padding:12px 16px;background:var(--soft);border-radius:16px;color:var(--ink);font-size:15px}
@media (max-width:820px){.dl{grid-template-columns:1fr;gap:2px}.dl dd{margin-bottom:10px}}
.ghost{background:var(--soft);border:0;border-radius:99px;padding:10px 18px;cursor:pointer;font-weight:500}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--veil),var(--img) center/cover no-repeat}
.card,.box,aside nav button,header select{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.fl{align-items:flex-end}.bar label{display:flex;align-items:center;gap:8px}.bar select,.fl input{width:auto}
#pn{white-space:pre-line}
.ghost.on{background:var(--green);color:var(--on)}#gd{width:min(860px,95vw)}
td[contenteditable],th[contenteditable]{min-width:110px;outline:none}td[contenteditable]:focus,th[contenteditable]:focus{background:var(--soft);box-shadow:inset 0 0 0 2px var(--green)}
.ic{margin-right:8px;font-style:normal}aside nav button .ic{display:inline-block;width:1.7em}
.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;margin-bottom:16px}.gr .card{margin:0}.gr .wide{grid-column:1/-1}
.hb{display:grid;grid-template-columns:minmax(90px,190px) 1fr auto;gap:10px;align-items:center;margin:10px 0;font-size:14px}.ht{background:var(--soft);border-radius:99px;height:14px;overflow:hidden}.ht i{display:block;height:100%;border-radius:99px;transform-origin:left}
.lg{display:flex;align-items:center;gap:8px;margin:6px 0}.lg i{width:12px;height:12px;border-radius:4px}.lg b{margin-left:auto}.dnw{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.dv{font:600 26px Fraunces,serif;fill:var(--ink)}.cl{font-size:11px;fill:var(--muted)}
@keyframes sx{from{transform:scaleX(0)}}@keyframes dn{from{stroke-dasharray:0 400}}@keyframes dr{from{stroke-dashoffset:1}}@keyframes fi{from{opacity:0}}@keyframes up{from{opacity:0;transform:translateY(16px)}}
.anim .ht i{animation:sx 1.1s cubic-bezier(.2,.8,.2,1) both}.anim .dn .s{animation:dn 1.2s ease-out both}.anim .ln{animation:dr 1.6s ease-out both}.anim .ar{animation:fi 1.8s ease-out both}
.anim .card{animation:up .6s ease-out both}.anim .cards .card:nth-child(2){animation-delay:.1s}.anim .cards .card:nth-child(3){animation-delay:.2s}.anim .cards .card:nth-child(4){animation-delay:.3s}.anim .cards .card:nth-child(5){animation-delay:.4s}
@media (prefers-reduced-motion:reduce){.anim *{animation:none!important}}
tr[data-trow]{cursor:pointer}tr[data-trow]:hover td{background:var(--soft)}
.photo{flex-wrap:wrap}#cd{width:min(440px,94vw)}#cv{display:block;margin:12px auto;max-width:100%;height:auto;border-radius:12px;touch-action:none;cursor:grab;background:#000}
#ddc .av img,#gdc .av img,#pimg,#tpimg{cursor:zoom-in}
input[readonly]{opacity:.8;cursor:not-allowed}
[hidden]{display:none!important}.sw.w{margin-top:12px!important}
</style>

async function loadFromCloud() {
  if (!sb || SUPABASE_ANON_KEY.includes('YOUR_ANON')) return null;
  try {
    const { data, error } = await sb.from('app_state').select('data').eq('id', 'main').maybeSingle();
    if (error) { console.warn('Supabase load error', error); return null; }
    return data && data.data ? data.data : null;
  } catch (e) { console.warn('Supabase load failed', e); return null; }
}

async function saveToCloud(state) {
  if (!sb || SUPABASE_ANON_KEY.includes('YOUR_ANON')) return;
  try {
    const { error } = await sb.from('app_state').upsert({
      id: 'main',
      data: state,
      updated_at: new Date().toISOString()
    });
    if (error) console.warn('Supabase save error', error);
  } catch (e) { console.warn('Supabase save failed', e); }
}

function tr(root){

  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),L=[];let n;while(n=w.nextNode())L.push(n);
  for(const n of L){const o=ORIG.has(n)?ORIG.get(n):n.nodeValue;ORIG.set(n,o);const k=o.trim();n.nodeValue=lang=='km'&&k?(KM[k]?o.replace(k,KM[k]):km2(o)):o}
  root.querySelectorAll('[placeholder],[aria-label],[label]').forEach(el=>{const m=ORIGA.get(el)||{};ORIGA.set(el,m);for(const a of['placeholder','aria-label','label']){if(!el.hasAttribute(a))continue;if(!(a in m))m[a]=el.getAttribute(a);el.setAttribute(a,lang=='km'&&KM[m[a]]||m[a])}})}

const sumP=(p,f,x)=>{const E=(p&&p.entries?p.entries:[]).filter(e=>inR(e.date,f,x)).sort((a,b)=>a.date.localeCompare(b.date)),l=E[E.length-1]||{},s=k=>E.reduce((n,e)=>n+(+e[k]||0),0);return{count:s('count'),ben:s('ben'),funds:s('funds'),date:l.date||'',note:l.note||''}};
const tot=(f,x)=>S.projects.reduce((n,p)=>{const c=sumP(p,f,x);n.count+=c.count;n.ben+=c.ben;n.funds+=c.funds;return n},{count:0,ben:0,funds:0});
const datebar=()=>`<div class="bar fl"><label>From <input type="date" id="dfrom" value="${DF.from}"></label><label>To <input type="date" id="dto" value="${DF.to}"></label><span>${[['all','All time'],['day','Today'],['month','This month'],['year','This year']].map(([k,l])=>`<button class="ghost" data-act="pre" data-k="${k}">${l}</button>`).join(' ')}</span></div>`;

const pkey=(d,g)=>g=='year'?d.slice(0,4):g=='month'?d.slice(0,7):d;
const pend=k=>k.length==4?k+'-12-31':k.length==7?k+'-31':k;
const cumBen=d=>S.projects.reduce((n,p)=>n+p.entries.filter(e=>e.date<=d).reduce((y,e)=>y+e.ben,0),0);
function periods(g){const m={},A=k=>m[k]=m[k]||{u:0,st:0,count:0,ben:0,funds:0};
 S.projects.forEach(p=>p.entries.forEach(e=>{if(!inR(e.date,DF.from,DF.to))return;const r=A(pkey(e.date,g));r.u++;r.count+=e.count;r.ben+=e.ben;r.funds+=e.funds}));
 S.students.forEach(s=>{if(s.enroll&&inR(s.enroll,DF.from,DF.to))A(pkey(s.enroll,g)).st++});
 const R=Object.keys(m).sort().map(k=>({k,...m[k],cum:cumBen(pend(k))}));return ord=='asc'?R:R.reverse()}
function perTable(){const R=periods(grp);if(!R.length)return'<div class="empty">No data yet. Add project updates or students.</div>';const sum=k=>R.reduce((n,r)=>n+r[k],0);
 return `<table style="min-width:680px"><thead><tr><th>Period</th><th>Updates</th><th>New students</th><th>Completed</th><th>Beneficiaries</th><th>Funds (USD)</th><th>Running total</th></tr></thead><tbody>${R.map(r=>`<tr><td>${r.k}</td><td>${r.u}</td><td>${r.st}</td><td>${num(r.count)}</td><td>${num(r.ben)}</td><td>${num(r.funds)}</td><td>${num(r.cum)}</td></tr>`).join('')}<tr><td><b>Total</b></td><td><b>${sum('u')}</b></td><td><b>${sum('st')}</b></td><td><b>${num(sum('count'))}</b></td><td><b>${num(sum('ben'))}</b></td><td><b>${num(sum('funds'))}</b></td><td><b>${num(cumBen('9999'))}</b></td></tr></tbody></table>`}
const perX=()=>[['Period','Updates','New students','Completed','Beneficiaries','Funds (USD)','Running total (beneficiaries)'],...periods(grp).map(r=>[r.k,r.u,r.st,r.count,r.ben,r.funds,r.cum])];

  if(a=='del'&&confirm(TT('Delete')+' '+S.students[i].en+'?')){const sid=S.students[i].id;S.students.splice(i,1);S.grades=S.grades.filter(g=>g.sid!=sid);S.att=S.att.filter(x=>x.sid!=sid);save();render()}
  if(a=='spclear'){
    const n=S.students.filter(s=>s.sponsored).length;
    if(!n){alert(TT('No sponsored students to delete.'));return}
    if(!confirm(TT('Delete all sponsored students')+' ('+n+')?\n'+TT('This cannot be undone.')))return;
    const ids=new Set(S.students.filter(s=>s.sponsored).map(s=>s.id));

    S.grades=S.grades.filter(g=>!ids.has(g.sid));
    S.att=S.att.filter(x=>!ids.has(x.sid));
    save();render();
  }
});

    const files=[...t.files];t.value='';if(!files.length)return;
    S.about=S.about||{text:'',photos:[],files:[]};const isPhoto=t.id==='aboutphoto';let left=files.length;
    files.forEach(file=>{const reader=new FileReader();reader.onload=()=>{const item={name:file.name,type:file.type,size:file.size,data:reader.result};if(isPhoto)S.about.photos.push(item);else S.about.files.push(item);left--;if(left<=0){save();render()}};reader.readAsDataURL(file)});return;
  }
  if(t.id=='dfrom'||t.id=='dto'){DF[t.id=='dfrom'?'from':'to']=t.value;render()}
  if(t.id=='ssort'){sstu=t.value;if(sstu=='id')ord='asc';render()}

  if(t.dataset.kn!==undefined){S.kpi.crit[t.dataset.kn].n=t.value.trim()||'Criterion';save();render()}
  if(t.dataset.kw!==undefined){S.kpi.crit[t.dataset.kw].w=Math.max(0,+t.value||0);save();render()}
  if(t.dataset.ks!==undefined){const key=t.dataset.ks;if(t.value==='')delete S.kpi.scores[key];else{const v=Math.min(100,Math.max(0,+t.value||0));S.kpi.scores[key]=v;t.value=v}save();kRefresh(key.split('|')[0])}
  if(t.id=='ocls'){ocls=t.value;render()}
  if(t.dataset.tg!==undefined){const v=t.value.trim();if(!v||/^https:\/\/(t|telegram)\.me\//i.test(v)){S.tg[t.dataset.tg]=v;save();render()}else t.nextElementSibling.textContent=TT('Enter a link that starts with https://t.me/')}
  if(t.id=='ofile'&&t.files[0]){const f=t.files[0],name=($('#oname').value||f.name.replace(/\.[^.]+$/,'')).trim(),cls=$('#ocl').value.trim();
    if(typeof XLSX=='undefined'){alert(TT('The spreadsheet reader could not load. Check your internet connection.'));return}
    f.arrayBuffer().then(buf=>{const wb=XLSX.read(buf,{type:'array'}),sheets=wb.SheetNames.map(n=>({name:n,rows:XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:'',raw:false}).map(r=>r.map(String))})).filter(s=>s.rows.length);
      if(!sheets.length){alert(TT('The file has no data.'));return}
      const o={id:uid(),name,cls,updated:today(),sheets};if(JSON.stringify(o).length>3e6){alert(TT('This file is too large. Keep it under about 3 MB.'));return}
      S.outlines.push(o);oid=o.id;osheet=0;save();render()}).catch(()=>alert(TT('Could not read this file.')))}
  if((t.id=='spfile'||t.id=='stufile')&&t.files[0]){
    const f=t.files[0], msg=$(t.id=='stufile'?'#stumsg':'#spmsg');
    if(typeof XLSX=='undefined'){alert(TT('The spreadsheet reader could not load. Check your internet connection.'));return}
    msg.textContent='Reading…';
    f.arrayBuffer().then(buf=>{
      const wb=XLSX.read(buf,{type:'array'});
      const sheet=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(sheet,{header:1,defval:'',raw:false});
      // Find header row
      let headerIdx=-1, headers=[];
      for(let i=0;i<Math.min(10,rows.length);i++){
        const r=rows[i].map(x=>String(x||'').toLowerCase().trim());
        if(r.some(x=>x.includes('full name')||x==='student id'||x.includes('sponsor name'))){
          headerIdx=i; headers=r; break;
        }
      }
      if(headerIdx<0){msg.textContent=TT('Could not find header row. Use the template columns.');return}
      const col=(...names)=>{
        for(const n of names){
          const nn=n.toLowerCase();
          for(let i=0;i<headers.length;i++){
            if(headers[i]===nn || headers[i].includes(nn)) return i;
          }
        }
        return -1;
      };
      const iId=col('student id');
      const iEnroll=col('enrollment date','enrollment');
      const iKm=col('full name (khmer)','name (khmer)','khmer');
      const iEn=col('full name (english)','name (english)','english name');
      const iSex=col('sex');
      const iBday=col('birthday');
      const iFather=col("father's name",'father');
      const iMother=col("mother's name",'mother');
      const iPhone=col('phone number','phone');
      const iKschool=col('khmer school');
      const iGrade=col('student grade','grade');
      const iVillage=col('village');
      const iCommune=col('commune');
      const iDistrict=col('district');
      const iProvince=col('province');
      const iCountry=col('country');
      const iLevel=col('english level','level');
      const iCls=col('class');
      const iCenter=col('center');
      const iSponsored=col('sponsored');
      const iSponsor=col('sponsor name','sponsor');
      const iSponsorId=col('sponsor id');
      const iDropout=col('drop out','dropout');
      let iStatus=-1;
      for(let i=0;i<headers.length;i++){if(headers[i]==='status'){iStatus=i;break}}
      if(iStatus<0){for(let i=0;i<headers.length;i++){if(headers[i].includes('status')&&!headers[i].includes('photo')){iStatus=i;break}}}
      const iNotes=col('notes');

      const yes=v=>{const s=String(v||'').trim().toLowerCase();return s==='yes'||s==='y'||s==='true'||s==='1'};
      const normDate=v=>{
        const s=String(v||'').trim();
        if(!s)return '';
        // already YYYY-MM-DD
        if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);
        // DD/MM/YYYY or MM/DD/YYYY
        const m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
        if(m){
          const a=+m[1],b=+m[2],y=m[3];
          // prefer DD/MM if first > 12
          if(a>12)return y+'-'+String(b).padStart(2,'0')+'-'+String(a).padStart(2,'0');
          return y+'-'+String(a).padStart(2,'0')+'-'+String(b).padStart(2,'0');
        }
        return s.slice(0,10);
      };
      const normCenter=v=>{
        const s=String(v||'').trim();
        if(!s)return '';
        if(/III|3/.test(s))return 'HVTO Free Education Center III';
        if(/II|2/.test(s))return 'HVTO Free Education Center II';
        if(/I|1/.test(s)||/center/i.test(s))return 'HVTO Free Education Center I';
        return s;
      };

      let updated=0, created=0, skipped=0; const used=new Set();
      for(let r=headerIdx+1;r<rows.length;r++){
        const row=rows[r];
        if(!row||row.every(x=>!String(x||'').trim()))continue;
        const en=iEn>=0?String(row[iEn]||'').replace(/\s+/g,' ').trim():'';
        const km=iKm>=0?String(row[iKm]||'').trim():'';
        const sid=iId>=0?String(row[iId]||'').trim():'';
        if(!en&&!km&&!sid){skipped++;continue}

        const sexRaw=iSex>=0?String(row[iSex]||'').trim():'';
        const sex=/^f/i.test(sexRaw)?'Female':/^m/i.test(sexRaw)?'Male':(sexRaw||'');
        const sponsored=iSponsored>=0?yes(row[iSponsored]):(t.id==='spfile');
        const dropout=iDropout>=0&&yes(row[iDropout]);
        let status=iStatus>=0?String(row[iStatus]||'').trim():'';
        const statusRaw=String(status||'').trim();
        const statusUp=statusRaw.toUpperCase();
        if(!statusRaw)status=dropout?'Dropped':'Active';
        else if(/GRAD/.test(statusUp))status='Graduated';
        else if(/^(DROP|DROPPED|DROP OUT|DROPOUT)/.test(statusUp)||statusUp==='DROP')status='Dropped';
        else if(/DIED|DEATH|PASSED AWAY|PASSED/.test(statusUp))status='Died';
        else if(/POSTPONE|POSTPONED|ON HOLD|HOLD/.test(statusUp))status='POSTPONE';
        else if(statusUp==='PST'||/^PST\b/.test(statusUp)||/POST\s*SECONDARY|POST-SECONDARY/.test(statusUp))status='PST';
        else if(/ACTIVE/.test(statusUp))status='Active';
        else if(/^[\d.]+$/.test(statusRaw))status='Active'; // numeric age wrongly in Status
        else status=statusRaw;

        const data={
          enroll:iEnroll>=0?normDate(row[iEnroll]):'',
          km, en:en||km,
          sex, bday:iBday>=0?normDate(row[iBday]):'',
          father:iFather>=0?String(row[iFather]||'').trim():'',
          mother:iMother>=0?String(row[iMother]||'').trim():'',
          phone:iPhone>=0?String(row[iPhone]||'').trim():'',
          kschool:iKschool>=0?String(row[iKschool]||'').trim():'',
          grade:iGrade>=0?String(row[iGrade]||'').trim():'',
          village:iVillage>=0?String(row[iVillage]||'').trim():'',
          commune:iCommune>=0?String(row[iCommune]||'').trim():'',
          district:iDistrict>=0?String(row[iDistrict]||'').trim():'',
          province:iProvince>=0?String(row[iProvince]||'').trim():'',
          country:iCountry>=0?String(row[iCountry]||'').trim():'Cambodia',
          level:iLevel>=0?String(row[iLevel]||'').trim():'',
          cls:iCls>=0?String(row[iCls]||'').trim():'',
          center:iCenter>=0?normCenter(row[iCenter]):'',
          sponsored, sponsor:iSponsor>=0?String(row[iSponsor]||'').trim():'',
          sponsorid:iSponsorId>=0?String(row[iSponsorId]||'').trim():'',
          dropout, dropdate:'', status,
          notes:iNotes>=0?String(row[iNotes]||'').trim():''
        };

        // Match by Student ID first. Only when the row has no Student ID, match by English name
        // (and center). A record already matched or created in this import is never reused, so
        // different students who share the same name stay separate records.
        let stu=null;
        if(sid)stu=S.students.find(s=>s.id===sid&&!used.has(s));
        if(!stu&&!sid&&en){
          const enLow=en.toLowerCase().replace(/\s+/g,' ');
          stu=S.students.find(s=>!used.has(s)&&(s.en||'').toLowerCase().replace(/\s+/g,' ')===enLow&&(!data.center||!s.center||s.center===data.center));
        }
        if(stu){
          Object.keys(data).forEach(k=>{if(data[k]!==''&&data[k]!==undefined)stu[k]=data[k]});
          if(sid)stu.id=sid;
          stu.sponsored=sponsored;
          stu.status=status;
          if(status==='Dropped'||dropout){stu.dropout=true;stu.status='Dropped'}
          else stu.dropout=false;
          used.add(stu);updated++;
        }else{
          const id=(sid&&!S.students.some(s=>s.id===sid))?sid:nextId(S.students,'HVTO-');
          const ns=Object.assign({id, photo:'', pstat:'', addr:''}, data, {center:data.center||Object.keys(CENTERS)[0], status, dropout:(status==='Dropped'||dropout)});
          S.students.push(ns);used.add(ns);created++;
        }
      }
      // Recount statuses for message
      const sc={Active:0,Graduated:0,Dropped:0,Died:0,POSTPONE:0,PST:0};
      S.students.filter(s=>s.sponsored).forEach(s=>{const k=s.status;if(sc[k]!==undefined)sc[k]++;});
      save();
      msg.textContent=TT('Import complete')+': '+updated+' updated, '+created+' created'+(skipped?', '+skipped+' skipped':'')
        +' | Active '+sc.Active+', Grad '+sc.Graduated+', Drop '+sc.Dropped+', Died '+sc.Died+', POSTPONE '+sc.POSTPONE+', PST '+sc.PST;
      t.value='';
      render();
    }).catch(e=>{console.warn(e);msg.textContent=TT('Could not read this file.')+': '+(e.message||e);});
  }
  if(t.id=='gsort'){gsort=t.value;render()}
  if(t.id=='gord'){gord=t.value;render()}
  if(t.id=='grp'){grp=t.value;render()}
});

/* ========== CLOUD SYNC BOOTSTRAP ========== */
(async function bootstrapCloud(){
  S.grades = S.grades || [];
  S.att = S.att || [];
  S.outlines = S.outlines || [];
  S.tg = S.tg || {};
  S.teachers = S.teachers || [];
  S.tatt = S.tatt || [];
  S.kpi = S.kpi || {crit:[{id:'k1',n:'Attendance & punctuality',w:25},{id:'k2',n:'Teaching quality',w:25},{id:'k3',n:'Student progress',w:25},{id:'k4',n:'Teamwork & communication',w:25}],scores:{}};
  S.projects = S.projects || [];
  S.worklog = S.worklog || [];
  S.schedule = S.schedule || [];
  S.about = S.about || {text:'',photos:[],files:[]};

  const cloud = await loadFromCloud();
  if (cloud && typeof cloud === 'object') {
    S.students = cloud.students || S.students;
    S.teachers = cloud.teachers || S.teachers;
    S.grades = cloud.grades || S.grades;
    S.att = cloud.att || S.att;
    S.outlines = cloud.outlines || S.outlines;
    S.tg = cloud.tg || S.tg;
    S.tatt = cloud.tatt || S.tatt;
    S.kpi = cloud.kpi || S.kpi;
    S.projects = cloud.projects || S.projects;
    S.worklog = cloud.worklog || S.worklog || [];
    S.schedule = cloud.schedule || S.schedule || [];
    S.about = cloud.about || S.about || {text:'',photos:[],files:[]};
    S.about = cloud.about || S.about || {text:'',photos:[],files:[]};
    try { localStorage.setItem('hvto-v2', JSON.stringify(S)); } catch(e) {}
    console.log('Loaded shared data from Supabase');
  } else if (sb && !SUPABASE_ANON_KEY.includes('YOUR_ANON')) {
    console.log('No cloud data yet – uploading current local state…');
    await saveToCloud(S);
  }

  render();
})();
